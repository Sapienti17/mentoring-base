<div class='user-list__items'>
  <p>{{ user.name }}</p>
  <p>{{ user.email }}</p>
  <p>{{ user.address.city }}</p>
  <p>{{ user.phone }}</p>
  <p>{{ user.website }}</p>
  <p>{{ user.company.name }}</p>
  <button class="user-list__btn" (click)="onDeleteUser(user.id)">Удалить</button>
  <button class="user-list__btn" (click)="showUserDialog()">Редактировать</button>

</div>
