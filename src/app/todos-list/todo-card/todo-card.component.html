<div class="todo-list__items">
  <div>Текст задачи:</div>
  <p>{{ todo.title | limitCharsPipe }}</p>
  <div>Автор задачи:</div>
  <p>{{ todo.userId }}</p>
  <div>Задача завершена:</div>
  <p>{{ todo.completed ? "Да" : "Нет" }}</p>
  <button class="todo-list__btn" (click)="onDeleteTodo(todo.id)">Удалить</button>
  <button class="todo-list__btn" (click)="showTodoDialog()">Редактировать</button>
</div>
