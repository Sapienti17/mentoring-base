<div class="container">
  <header class="header">
    <div class="header__left">
      <a href="/" class="header__logo">
        <img src="../assets/img/logo.svg" alt="Логотип">
      </a>
      <nav class="header__nav">
        <a href="/" class="header__nav--item">Главная</a>
        <a href="/" class="header__nav--item">О компании</a>
        <a href="/" class="header__nav--item">Каталог</a>
      </nav>
    </div>
    <div class="header__right">
      <a href="/" class="header__right--contacts">
        <img src="../assets/img/phone.svg" alt="Контактный номер">
        <p class="header__contacts--phone">+7 (965) 084-29-29</p>
      </a>
      <a href="/" class="header__right--selected">
        <img src="../assets/img/heart.svg" alt="Избранное">
      </a>
      <button class="header__right-button">
        <img src="../assets/img/shopping-cart.png" class="header__right-button-img" alt="Корзина">
        Пусто</button>
    </div>
  </header>
  <div class="header-subtitle">
    <div class="header-subtitle__catalog">
      <div class="header-subtitle__list">
        <button class="header-subtitle-list__burger-menu">
          <img src="../assets/img/burger_menu.svg" alt="Каталог">
        </button>
        <div class="header-subtitle__nav">
          <button class="header-subtitle-nav__link">Каталог</button>
          <button class="header-subtitle-nav__link">Стройматериалы</button>
          <button class="header-subtitle-nav__link">Инструменты</button>
          <button class="header-subtitle-nav__link">Электрика</button>
          <button class="header-subtitle-nav__link">Интерьер и одежда</button>
        </div>
      </div>
    </div>
    <div class="header-subtitle__search">
      <div class="header-subtitle__input">
        <input class="header-subtitle-input__item" type="text"
          placeholder="Поиск, например Круг зачистной ">
        <img class="header-subtitle__input--searchimg" src="../assets/img/Search.svg" alt="Поиск">
      </div>
      <div class="header-subtitle__location">
        <img src="../assets/img/location.svg" alt="Локация">
        <span class="header-subtitle__city">Москва</span>
      </div>
    </div>
  </div>
</div>
